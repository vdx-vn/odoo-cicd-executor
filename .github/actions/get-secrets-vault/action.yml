name: 'get-secrets-vault'
description: 'Export KV v2 secrets from all leaf nodes under a base folder'
inputs:
  vault_addr:  { required: true,  description: 'Vault address' }
  token:       { required: true,  description: 'Vault token' }
  secret_paths:{ required: true,  description: 'Comma-separated BASE folders (without mount), e.g. vdx-vn/cicd-test/dev' }
  mount:       { required: false, default: kv, description: 'KV v2 mount name' }
  skip_verify: { required: false, default: '1', description: 'VAULT_SKIP_VERIFY (1 to skip TLS verify)' }
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail

        command -v jq >/dev/null 2>&1 || { sudo apt-get update -y && sudo apt-get install -y jq; }
        if ! command -v vault >/dev/null 2>&1; then
          curl -fsSL https://apt.releases.hashicorp.com/gpg | sudo apt-key add -
          sudo apt-add-repository "deb [arch=amd64] https://apt.releases.hashicorp.com $(lsb_release -cs) main"
          sudo apt-get update -y && sudo apt-get install -y vault
        fi

        export VAULT_ADDR="${{ inputs.vault_addr }}"
        export VAULT_TOKEN="${{ inputs.token }}"
        export VAULT_SKIP_VERIFY="${{ inputs.skip_verify }}"
        MOUNT="${{ inputs.mount }}"

        echo "[get-secrets-vault] VAULT_ADDR=$VAULT_ADDR"
        echo "[get-secrets-vault] MOUNT=$MOUNT"
        echo "[get-secrets-vault] BASES=${{ inputs.secret_paths }}"
        echo "[get-secrets-vault] VAULT_SKIP_VERIFY=$VAULT_SKIP_VERIFY"

        # ---- helpers (giữ log debug, tách stdout/stderr) ----
        kv_get()  { echo "[get-secrets-vault] GET  $MOUNT/$1"; vault kv get  -mount="$MOUNT" -format=json "$1" 2> >(tee /dev/stderr >&2) || true; }
        kv_list() {
          echo "[get-secrets-vault] LIST $MOUNT/$1"
          local out; out="$(vault kv list -mount="$MOUNT" -format=json "$1" 2> >(tee /dev/stderr >&2) || true)"
          if [ -z "$out" ] || ! echo "$out" | jq -e . >/dev/null 2>&1; then
            local p="$1"; [[ "$p" == */ ]] || p="$p/"
            echo "[get-secrets-vault] LIST $MOUNT/$p"
            out="$(vault kv list -mount="$MOUNT" -format=json "$p" 2> >(tee /dev/stderr >&2) || true)"
          fi
          printf "%s" "$out"
        }

        export_json() {
          local js="$1"
          [ -n "$js" ] && [ "$(echo "$js" | jq -r 'try .data.data != null catch "false"')" = "true" ] || return 1
          echo "$js" | jq -r '.data.data | to_entries[] | "\(.key)=\(.value)"' | while IFS='=' read -r k v; do
            echo "${k^^}=$v" >> "$GITHUB_ENV"
          done
        }

        walk_children() {
          local base="${1%/}"
          local children; children="$(kv_list "$base" | jq -r 'try .[] catch empty' 2>/dev/null || true)"
          [ -z "$children" ] && { echo "[get-secrets-vault] Warning: No children under $base"; return 0; }
          while IFS= read -r child; do
            [ -z "$child" ] && continue
            local path="$base/$child"
            # nếu list được => folder; ngược lại coi là leaf
            if kv_list "$path" | jq -e . >/dev/null 2>&1; then
              walk_children "$path"
            else
              export_json "$(kv_get "$path" | jq -r 'try . catch empty' 2>/dev/null || true)" \
                || echo "[get-secrets-vault] Warning: No data or cannot access $path" >&2
            fi
          done <<< "$children"
        }

        IFS=',' read -ra BASES <<< "${{ inputs.secret_paths }}"
        for b in "${BASES[@]}"; do walk_children "$b"; done