name: 'get-secrets-vault'
description: 'Export all key-value pairs from folders under a Vault base path (KV v2)'
inputs:
  vault_addr:
    required: true
    description: 'Vault address'
  token:
    required: true
    description: 'Vault token'
  secret_paths:
    required: true
    description: 'Comma-separated BASE paths (folders) in KV v2, WITHOUT mount name. Example: vdx-vn/cicd-test/dev'
  mount:
    required: false
    default: kv
    description: 'KV v2 mount name (default: kv)'
  namespace:
    required: false
    default: ''
    description: 'Vault namespace (optional)'
  skip_verify:
    required: false
    default: '1'
    description: 'Set VAULT_SKIP_VERIFY (default: 1)'
runs:
  using: "composite"
  steps:
    - shell: bash
      run: |
        set -euo pipefail

        command -v jq >/dev/null 2>&1 || { sudo apt-get update -y && sudo apt-get install -y jq; }
        if ! command -v vault >/dev/null 2>&1; then
          curl -fsSL https://apt.releases.hashicorp.com/gpg | sudo apt-key add -
          sudo apt-add-repository "deb [arch=amd64] https://apt.releases.hashicorp.com $(lsb_release -cs) main"
          sudo apt-get update && sudo apt-get install -y vault
        fi

        export VAULT_ADDR="${{ inputs.vault_addr }}"
        export VAULT_TOKEN="${{ inputs.token }}"
        export VAULT_SKIP_VERIFY="${{ inputs.skip_verify }}"
        MOUNT="${{ inputs.mount }}"
        [ -n "${{ inputs.namespace }}" ] && export VAULT_NAMESPACE="${{ inputs.namespace }}"

        echo "[get-secrets-vault] VAULT_ADDR=$VAULT_ADDR"
        echo "[get-secrets-vault] MOUNT=$MOUNT"
        echo "[get-secrets-vault] BASE SECRET_PATHS=${{ inputs.secret_paths }}"
        [ -n "${VAULT_NAMESPACE:-}" ] && echo "[get-secrets-vault] VAULT_NAMESPACE=$VAULT_NAMESPACE"
        echo "[get-secrets-vault] VAULT_SKIP_VERIFY=$VAULT_SKIP_VERIFY"

        exported_keys=()

        # Chỉ trả stdout JSON cho jq; stderr vẫn in ra để debug
        kv_get_stdout() {
          local p="$1"
          echo "[get-secrets-vault] TRY GET: $MOUNT/$p"
          vault kv get -mount="$MOUNT" -format=json "$p" 2> >(tee /dev/stderr >&2)
        }

        kv_list_stdout() {
          local p="$1"
          echo "[get-secrets-vault] TRY LIST: $MOUNT/$p"
          vault kv list -mount="$MOUNT" -format=json "$p" 2> >(tee /dev/stderr >&2)
        }

        export_json_to_env() {
          local json="$1"
          if [ -n "$json" ] && [ "$(echo "$json" | jq -r 'try .data.data != null catch "false"')" = "true" ]; then
            echo "$json" | jq -r '.data.data | to_entries[] | "\(.key)=\(.value)"' | \
            while IFS='=' read -r k v; do
              echo "${k^^}=$v" >> "$GITHUB_ENV"
              exported_keys+=("${k^^}")
            done
            return 0
          fi
          return 1
        }

        is_folder() {
          local p="$1"
          local out
          out="$(kv_list_stdout "$p" || true)"
          [ -n "$out" ] && [ "$(echo "$out" | jq -r 'type' 2>/dev/null || echo '')" = "array" ]
        }

        # Chỉ đệ quy qua CÁC FOLDER CON của base; KHÔNG đọc secret ở base
        walk_children() {
          local base="${1%/}"
          local children
          children="$(kv_list_stdout "$base" | jq -r 'try .[] catch empty' 2>/dev/null || true)"

          if [ -z "$children" ]; then
            echo "[get-secrets-vault] Warning: No children under $base"
            return 0
          fi

          while IFS= read -r child; do
            [ -z "$child" ] && continue
            local path="$base/$child"

            if [[ "$child" == */ ]] || is_folder "$path"; then
              # folder → duyệt sâu tiếp
              walk_children "$path"
            else
              # leaf → get trực tiếp
              export_json_to_env "$(kv_get_stdout "$path" | jq -r 'try . catch empty' 2>/dev/null || true)" || \
                echo "[get-secrets-vault] Warning: No data or cannot access $path" >&2
            fi
          done <<< "$children"
        }

        IFS=',' read -ra BASES <<< "${{ inputs.secret_paths }}"
        for base in "${BASES[@]}"; do
          walk_children "$base"
        done

        if [ "${#exported_keys[@]}" -gt 0 ]; then
          printf -v joined '%s,' "${exported_keys[@]}"; joined="${joined%,}"
          echo "VAULT_EXPORTED_KEYS=$joined" >> "$GITHUB_ENV"
          echo "[get-secrets-vault] Exported keys: $joined"
        else
          echo "[get-secrets-vault] Warning: No data exported from any provided base path!"
        fi