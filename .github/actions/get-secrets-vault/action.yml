name: 'get-secrets-vault'
description: 'Export all key-value pairs from Vault secret path(s) to environment'
inputs:
  vault_addr:
    required: true
    description: 'Vault address'
  token:
    required: true
    description: 'Vault token'
  secret_paths:
    required: true
    description: 'Comma-separated list of Vault secret paths (KV v2)'
runs:
  using: "composite"
  steps:
    - shell: bash
      run: |
        set -euo pipefail

        if ! command -v vault &> /dev/null; then
          curl -fsSL https://apt.releases.hashicorp.com/gpg | sudo apt-key add -
          sudo apt-add-repository "deb [arch=amd64] https://apt.releases.hashicorp.com $(lsb_release -cs) main"
          sudo apt-get update && sudo apt-get install vault -y
        fi

        export VAULT_ADDR="${{ inputs.vault_addr }}"
        export VAULT_TOKEN="${{ inputs.token }}"
        MOUNT="kv"

        get_all_secret_paths() {
          local base_path="$1"
          local children
          children=$(vault kv list -mount="$MOUNT" -format=json "$base_path" 2>/dev/null | jq -r '.[]' || true)
          for child in $children; do
            if [[ "$child" == */ ]]; then
              get_all_secret_paths "${base_path}${child}"
            else
              echo "${base_path}${child}"
            fi
          done
        }

        IFS=',' read -ra PATHS <<< "${{ inputs.secret_paths }}"
        for base_path in "${PATHS[@]}"; do
          for secret_path in $(get_all_secret_paths "$base_path"); do
            secret_json=$(vault kv get -mount="$MOUNT" -format=json "$secret_path" 2>/dev/null || echo "")
            if [ -n "$secret_json" ] && [ "$(echo "$secret_json" | jq '.data.data != null')" = "true" ]; then
              echo "$secret_json" | jq -r '.data.data | to_entries[] | "\(.key)=\(.value)"' | \
              while IFS='=' read -r k v; do
                KEY_UPPER=$(echo "$k" | tr '[:lower:]' '[:upper:]')
                case "$KEY_UPPER" in
                  *PASSWORD*|*TOKEN*|*SECRET*|*PRIVATE_KEY*)
                    if [ -n "$v" ]; then
                      echo "::add-mask::$v"
                    fi
                    ;;
                esac
                echo "[get-secrets-vault] Exporting key: $KEY_UPPER"
                echo "$KEY_UPPER=$v" >> $GITHUB_ENV
              done
            else
              echo "[get-secrets-vault] Warning: No data or cannot access $secret_path" >&2
            fi
          done
        done