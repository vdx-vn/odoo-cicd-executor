name: "SCP through SSH"
inputs:
    # Server info
    host:
        required: true
    user:
        required: true
    port:
        required: true
        default: 22
    ssh_key_text:
        description: "SSH private key text"
        required: true
    # Proxy server info
    proxy_host:
        required: false
    proxy_user:
        required: false
    proxy_port:
        required: false
        default: 22
    proxy_ssh_key_text:
        required: false

    direction:
        description: "download/upload"
        required: true
        default: "download"
    local_file:
        required: true
    server_file:
        required: true
    include_file_name:
        default: "no"
        required: true
        description: "Does server file path include file name at the end or just the folder path (yes | no)"

runs:
    using: "composite"
    steps:
        - name: "Download backup file"
          shell: bash
          run: |
              function create_private_keyfile_from_content() {
                content="$1"
                key_file_path="$2"
                mkdir -p $(dirname $key_file_path)
                touch $key_file_path && chmod 600 $key_file_path
                >$key_file_path
                echo "$content" >>$key_file_path
              }

              function generate_ssh_option() {
                    ssh_options="-o \"StrictHostKeyChecking=no\" -o \"ServerAliveInterval=60\""
                    if [[ -n "${{ inputs.proxy_host }}" ]]; then
                        proxy_keyfile_path="${{ github.workspace }}"/$(date +%s)_key_proxy
                        create_private_keyfile_from_content "${{inputs.proxy_ssh_key_text}}" "$proxy_keyfile_path"
                        proxy_command="ProxyCommand ssh -i $proxy_keyfile_path -W %h:%p $proxy_user@$proxy_host -p $proxy_port"
                        ssh_options+="-o \"$proxy_command\""
                    fi
                    echo "$ssh_options"
              }

              ssh_options=$(generate_ssh_option)
              echo "show me ============================="
              echo $ssh_options
              keyfile_path=${{ github.workspace }}/$(date +%s)_key
              create_private_keyfile_from_content "${{inputs.ssh_key_text}}" "$keyfile_path"

              if [[ ${{ inputs.direction }} == "download" ]]; then
                scp $ssh_options -P ${{ inputs.port }} -i $keyfile_path ${{ inputs.user }}@${{ inputs.host }}:${{ inputs.server_file }} ${{ inputs.local_file }}
              else
                file_path=${{ inputs.server_file }}
                include_file_name=${{ inputs.include_file_name }}
                if [ $include_file_name == "yes" ]; then
                    folder_path=$(dirname "$file_path")
                else
                    folder_path=$file_path
                fi
                
                ssh $ssh_options -p ${{ inputs.port }} -i $keyfile_path ${{ inputs.user }}@${{ inputs.host }} "
                    if [ ! -d "$folder_path" ]; then
                        mkdir -p $folder_path
                    fi
                "

                scp $ssh_options -P ${{ inputs.port }} -i $keyfile_path ${{ inputs.local_file }} ${{ inputs.user }}@${{ inputs.host }}:${{ inputs.server_file }}
              fi
