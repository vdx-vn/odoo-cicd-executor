[tool.pylint.main]
ignore = ["__manifest__.py", "__init__.py"]
ignore-paths = []
output-format = "text"
disable = "all"
enable = ["super-with-arguments","consider-using-generator","superfluous-parens","unused-import","unreachable","no-else-raise","use-implicit-booleaness-not-len","unused-variable","missing-final-newline","pointless-string-statement","pointless-statement","multiple-statements","inconsistent-return-statements","consider-using-dict-items","unused-argument","raise-missing-from","consider-using-set-comprehension","redefined-builtin","consider-using-in","no-else-return","too-many-nested-blocks","bad-indentation","trailing-whitespace","line-too-long","use-a-generator","syntax-error","undefined-variable","not-callable","consider-using-ternary","simplifiable-if-expression","unnecessary-pass","redefined-outer-name","duplicate-key","chained-comparison","expression-not-assigned","function-redefined","consider-using-with","singleton-comparison","f-string-without-interpolation","useless-parent-delegation","self-assigning-variable","unsubscriptable-object","bad-file-encoding","possibly-used-before-assignment","redundant-u-string-prefix","use-a-generator","unnecessary-comprehension","unidiomatic-typecheck","reimported","useless-return","used-before-assignment","unnecessary-lambda"]

[tool.pylint.format]
max-line-length = 180