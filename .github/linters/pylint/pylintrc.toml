[tool.pylint.main]
ignore = ["__manifest__.py", "__init__.py"]
exit-zero = true
output-format = "text"
disable = "all"
enable = ["line-too-long","unused-import","super-with-arguments","wrong-import-order","use-a-generator","missing-final-newline","bad-indentation"]

[tool.pylint.format]
max-line-length = 200