name: ci/cd
on:
    workflow_call:
        inputs:
            repo_name:
                required: true
                type: string
            action:
                required: true
                type: string
            source_branch:
                required: true
                type: string
            target_branch:
                required: true
                type: string
            commit_sha:
                required: false
                type: string
            pr_number:
                required: false
                type: string
            pr_url:
                required: false
                type: string
            checkout_postfix_path:
                required: false
                type: string
                default: odoo/addons
            # FIXME: remove ignore test input later (update all Odoo project to use additional_args)
            ignore_test:
                required: false
                type: string
            additional_args:
                required: false
                type: string

env:
    # Common variables
    REPO_PATH: ${{github.workspace}}/${{inputs.checkout_postfix_path}}
    WORKSPACE: ${{github.workspace}}
    SERVER_CICD_SCRIPT_FOLDER: /tmp/odoo/cicd/${{ inputs.repo_name }}/${{inputs.target_branch}}
    ODOO_ADDONS_PATH: ${{github.workspace}}/${{inputs.checkout_postfix_path}}

    ODOO_CONFIG_FILE: ${{github.workspace}}/.github/odoo/etc/odoo.conf
    DOCKER_FOLDER: ${{github.workspace}}/.github/odoo
    ODOO_TEST_DATABASE_NAME: odoo_test
    ODOO_LOG_FILE_CONTAINER: /var/log/odoo/odoo.log
    ODOO_LOG_FILE_HOST: ${{github.workspace}}/.github/odoo/logs/odoo.log
    CICD_ODOO_OPTIONS: ${{github.workspace}}/.github/conf/odoo.json
    CICD_SCRIPTS_PATH: ${{github.workspace}}/.github/scripts
    CICD_UTILS_SCRIPTS_PATH: ${{github.workspace}}/.github/scripts/utils.sh
    ODOO_IMAGE_EXTRACT_PATH: "/tmp/odoo.tar"
    DB_IMAGE_EXTRACT_PATH: "/tmp/db.tar"

    # ==== Workflow inputs ====
    SOURCE_BRANCH: ${{ inputs.source_branch }}
    TARGET_BRANCH: ${{ inputs.target_branch }}
    REPOSITORY: ${{ inputs.repo_name }}
    PR_NUMBER: ${{ inputs.pr_number }}
    PR_URL: ${{ inputs.pr_url }}
    IGNORE_TEST: ${{ fromJson(inputs.additional_args).ignore_test }}
    IGNORE_INTEGRATION_TEST: ${{ fromJson(inputs.additional_args).ignore_integration_test || 'false' }}
    COMMIT_AUTHOR: ${{ fromJson(inputs.additional_args).pr_author }}
    IGNORED_AUTO_INSTALL: ${{ fromJson(inputs.additional_args).ignore_auto_install}}

    # ==== Vault secrets ====
    VAULT_ADDR: ${{ secrets.VAULT_ADDR }} # Vault address
    VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }} # Vault token
    VAULT_SECRET_PATHS: ${{ secrets.VAULT_SECRET_PATHS }} # Comma-separated list of Vault secret paths (KV v2)

    # ==== Repository secrets ====
    GH_SSH_KEY: ${{secrets.GH_SSH_KEY}} # ssh key text to access GitHub repo
    GH_CHECK_RUNS_MANAGER_TOKEN: ${{ secrets.GH_CHECK_RUNS_MANAGER_TOKEN }} # token use to create and update check run
    GH_TOKEN: ${{secrets.GH_TOKEN}} # token use to build and push package to GitHub container registry

    # ==== Environment secrets =====
    #TELEGRAM_CHANNEL_ID: ${{secrets.TELEGRAM_CHANNEL_ID}}
    #TELEGRAM_TOKEN: ${{secrets.TELEGRAM_TOKEN}}
    #SLACK_CHANNEL_ID: ${{secrets.SLACK_CHANNEL_ID}}
    #SLACK_TOKEN: ${{secrets.SLACK_TOKEN}}
    #SERVER_PRIVATE_KEY: ${{secrets.SERVER_PRIVATE_KEY}}
    #PROXY_SERVER_PRIVATE_KEY: ${{secrets.PROXY_SERVER_PRIVATE_KEY}}
    #SERVER_DB_PASSWORD: ${{secrets.SERVER_DB_PASSWORD}}

    # ===== Environment variables =====
    #ODOO_IMAGE_TAG: ${{ vars.ODOO_IMAGE_TAG }}
    #DB_IMAGE_TAG: ${{ vars.DB_IMAGE_TAG }}
    #SERVER_HOST: ${{ vars.SERVER_HOST }}
    #SERVER_USER: ${{ vars.SERVER_USER }}
    #SERVER_SSH_PORT: ${{ vars.SERVER_SSH_PORT }}
    #PROXY_SERVER_HOST: ${{ vars.PROXY_SERVER_HOST }}
    #PROXY_SERVER_USER: ${{ vars.PROXY_SERVER_USER }}
    #PROXY_SERVER_SSH_PORT: ${{ vars.PROXY_SERVER_SSH_PORT }}
    #SERVER_SH_HOST: ${{ vars.SERVER_SH_HOST }} # "192.168.98.107": self-hosted server host
    #SERVER_SH_PORT: ${{ vars.SERVER_SH_PORT }} # "22": self-hosted server ssh port
    #SERVER_DEPLOY_PATH: ${{ vars.SERVER_DEPLOY_PATH }}
    #SERVER_ODOO_URL: ${{ vars.SERVER_ODOO_URL }}
    #SERVER_ODOO_DB_NAME: ${{ vars.SERVER_ODOO_DB_NAME }}
    #SERVER_BACKUP_PATH: ${{ vars.SERVER_BACKUP_PATH }} # add _ to this environment variable to always create backup file from server
    #MINIO_BACKUP_BUCKET: ${{ vars.MINIO_BACKUP_BUCKET }} 
    #MINIO_ACCESS_KEY: ${{ vars.MINIO_ACCESS_KEY }}
    #MINIO_SECRET_KEY: ${{ vars.MINIO_SECRET_KEY }}

    # ===== Handle Input for actions/github-script ======
    INPUT_REPO_NAME: ${{inputs.repo_name}}
    INPUT_COMMIT_SHA: ${{inputs.commit_sha}}

jobs:
    # ================== Pylint ===================
    Pylint-Linter:
        name: Pylint Linter_${{inputs.repo_name}}
        runs-on: ubuntu-latest
        environment: ${{inputs.repo_name}}/${{inputs.target_branch}}
        if: ${{ fromJson(inputs.additional_args).enable_linter == 'true' && (inputs.action == 'test' || inputs.action == 'deploy') }}

        steps:
            -   uses: actions/checkout@v4
            -   name: get-secrets-vault
                uses: ./.github/actions/get-secrets-vault
                with:
                    vault_addr: ${{ secrets.VAULT_ADDR }}
                    token: ${{ secrets.VAULT_TOKEN }}
                    secret_paths: ${{ secrets.VAULT_SECRET_PATHS }}

            -   name: Create Check Run
                uses: ./.github/actions/create-check-run
                id: create-check-run
                with:
                    name: "Pylint Linter"

            -   name: Test Preparation
                uses: ./.github/actions/prepare-test-data

            -   name: Pylint Linter
                uses: actions/setup-python@v3
                with:
                    python-version: ${{ fromJson(inputs.additional_args).python_version || '3.8'}}
            -   name: Analysing the code with pylint
                id: pylint-linter
                run: |
                    source ${{env.CICD_UTILS_SCRIPTS_PATH}}
                    ignore_linters=$(echo '${{inputs.additional_args}}' | jq -r '.ignore_linters')
                    
                    pylint_config_file="${{env.WORKSPACE}}/.github/linters/pylint/pylintrc.toml"
                    update_ignore_file_config_pylint "$ignore_linters" "$pylint_config_file"
                    
                    python -m pip install --upgrade pip
                    pip install pylint
                    cd ${{env.REPO_PATH}}
                    pylint \
                    --rcfile "$pylint_config_file" \
                    --output ${{env.WORKSPACE}}/pylint-output \
                    $(git ls-files '*.py')

            -   name: Update Check Run
                uses: ./.github/actions/update-check-run
                if: ${{always()}}
                id: update-check-run
                with:
                    check-run-id: ${{steps.create-check-run.outputs.check-run-id}}
                    conclusion: ${{ steps.pylint-linter.conclusion == 'success' && 'success' || 'failure' }}

            -   name: Send linting result to external Chat application
                run: |
                    source ${{env.CICD_UTILS_SCRIPTS_PATH}}
                    result=${{ steps.pylint-linter.conclusion == 'success' && 'success' || 'failure' }}
                    if [[ $result == "failure" ]]; then
                      send_file_notification "${{env.WORKSPACE}}/pylint-output" "⚠️Pylint Linter Error⚠️"
                    fi
                if: ${{always()}}

    # =================== Ruff ====================
    Ruff-Linter:
        # TODO: temporary disable Ruff linter, we should add option to enable/disable it later
        name: Ruff Linter_${{inputs.repo_name}}
        runs-on: ubuntu-latest
        environment: ${{inputs.repo_name}}/${{inputs.target_branch}}
        if: ${{ fromJson(inputs.additional_args).enable_linter == '_' && (inputs.action == 'test' || inputs.action == 'deploy') }}
        steps:
            -   uses: actions/checkout@v4
            -   name: get-secrets-vault
                uses: ./.github/actions/get-secrets-vault
                with:
                    vault_addr: ${{ secrets.VAULT_ADDR }}
                    token: ${{ secrets.VAULT_TOKEN }}
                    secret_paths: ${{ secrets.VAULT_SECRET_PATHS }}

            -   name: Create Check Run
                uses: ./.github/actions/create-check-run
                id: create-check-run
                with:
                    name: "Ruff Linter"
            -   name: Test Preparation
                uses: ./.github/actions/prepare-test-data

            -   name: Update config
                run: |
                    source ${{env.CICD_UTILS_SCRIPTS_PATH}}
                    ruff_config_file="${{env.WORKSPACE}}/.github/linters/ruff/ruff.toml"
                    ignore_linters=$(echo '${{inputs.additional_args}}' | jq -r '.ignore_linters')
                    update_ignore_file_config_ruff "$ignore_linters" "$ruff_config_file"

            -   name: Ruff Linter
                uses: astral-sh/ruff-action@v3
                id: ruff-linter
                with:
                    # TODO: try to use more Ruff options to validate python files
                    src: ${{env.REPO_PATH}}
                    args: " \
                      check
                      --config ${{env.WORKSPACE}}/.github/linters/ruff/ruff.toml \
                      --output-file ${{env.WORKSPACE}}/ruff-output \
                      --output-format concise"

            -   name: Update Check Run
                uses: ./.github/actions/update-check-run
                if: ${{always()}}
                id: update-check-run
                with:
                    check-run-id: ${{steps.create-check-run.outputs.check-run-id}}
                    conclusion: ${{ steps.ruff-linter.conclusion == 'success' && 'success' || 'failure' }}

            -   name: Send linting result to external Chat application
                run: |
                    source ${{env.CICD_UTILS_SCRIPTS_PATH}}
                    result=${{ steps.ruff-linter.conclusion == 'success' && 'success' || 'failure' }}
                    if [[ $result == "failure" ]]; then
                      send_file_notification "${{env.WORKSPACE}}/ruff-output" "⚠️Ruff Linter Error⚠️"
                    fi
                if: ${{always()}}

    unit-test-at-install:
        name: Unit test at install_${{inputs.repo_name}}
        runs-on: ubuntu-latest
        environment: ${{inputs.repo_name}}/${{inputs.target_branch}}
        if: inputs.action == 'test' || inputs.action == 'deploy'
        steps:
            -   uses: actions/checkout@v4
            -   name: get-secrets-vault
                uses: ./.github/actions/get-secrets-vault
                with:
                    vault_addr: ${{ secrets.VAULT_ADDR }}
                    token: ${{ secrets.VAULT_TOKEN }}
                    secret_paths: ${{ secrets.VAULT_SECRET_PATHS }}

            -   name: Create Check Run
                uses: ./.github/actions/create-check-run
                id: create-check-run
                with:
                    name: "Unit test at install"

            -   name: Test Preparation
                uses: ./.github/actions/prepare-test-data

            -   name: Print run id
                run: |
                    echo "Run ID: ${{ github.run_id }}"
                    echo "Job ID: ${{ github.job }}"

            -   name: Run Unit test cases
                id: run_at_install_unit_test
                run: |
                    bash $CICD_SCRIPTS_PATH/run-unit-test.sh "at_install"

            -   name: Update Check Run
                uses: ./.github/actions/update-check-run
                if: ${{always()}}
                id: update-check-run
                with:
                    check-run-id: ${{steps.create-check-run.outputs.check-run-id}}
                    conclusion: ${{ steps.run_at_install_unit_test.conclusion == 'success' && 'success' || 'failure' }}

    unit-test-post-install:
        name: Unit test post install_${{inputs.repo_name}}
        runs-on: ubuntu-latest
        environment: ${{inputs.repo_name}}/${{inputs.target_branch}}
        if: inputs.action == 'test' || inputs.action == 'deploy'
        steps:
            -   uses: actions/checkout@v4
            -   name: get-secrets-vault
                uses: ./.github/actions/get-secrets-vault
                with:
                    vault_addr: ${{ secrets.VAULT_ADDR }}
                    token: ${{ secrets.VAULT_TOKEN }}
                    secret_paths: ${{ secrets.VAULT_SECRET_PATHS }}

            -   name: Create Check Run
                uses: ./.github/actions/create-check-run
                id: create-check-run
                with:
                    name: "Unit test post install"

            -   name: Test Preparation
                uses: ./.github/actions/prepare-test-data

            -   name: Run Unit test cases
                id: run_post_install_unit_test
                run: |
                    bash $CICD_SCRIPTS_PATH/run-unit-test.sh "post_install"

            -   name: Update Check Run
                uses: ./.github/actions/update-check-run
                if: ${{always()}}
                id: update-check-run
                with:
                    check-run-id: ${{steps.create-check-run.outputs.check-run-id}}
                    conclusion: ${{ steps.run_post_install_unit_test.conclusion == 'success' && 'success' || 'failure' }}

    static-application-security-testing:
        name: Static Application Security Testing_${{inputs.repo_name}}
        runs-on: ubuntu-latest
        environment: ${{inputs.repo_name}}/${{inputs.target_branch}}
        if: ${{ fromJson(inputs.additional_args).enable_sast == 'true' && (inputs.action == 'test' || inputs.action == 'deploy') }}
        steps:
            -   uses: actions/checkout@v4
            -   name: get-secrets-vault
                uses: ./.github/actions/get-secrets-vault
                with:
                    vault_addr: ${{ secrets.VAULT_ADDR }}
                    token: ${{ secrets.VAULT_TOKEN }}
                    secret_paths: ${{ secrets.VAULT_SECRET_PATHS }}

            -   name: Create Check Run
                uses: ./.github/actions/create-check-run
                id: create-check-run
                with:
                    name: "SAST Security Scan"

            -   name: Test Preparation
                uses: ./.github/actions/prepare-test-data

            -   name: Setup Python
                uses: actions/setup-python@v3
                with:
                    python-version: ${{ fromJson(inputs.additional_args).python_version || '3.8'}}

            -   name: Install Bandit
                run: |
                    python -m pip install --upgrade pip
                    pip install bandit

            -   name: Run Bandit Security Scan
                id: bandit-scan
                run: |
                    source ${{env.CICD_UTILS_SCRIPTS_PATH}}
                    ignore_sast=$(echo '${{inputs.additional_args}}' | jq -r '.ignore_sast')
                    
                    bandit_config_file="${{env.WORKSPACE}}/.github/sast/bandit.yaml"
                    update_ignore_file_config_bandit "$ignore_sast" "$bandit_config_file"
                    
                    cd ${{env.REPO_PATH}}
                    bandit \
                        --configfile "$bandit_config_file" \
                        --format json \
                        --output ${{env.WORKSPACE}}/bandit-output.json \
                        --recursive . || true

            -   name: Generate SAST Report
                id: generate-sast-report
                run: |
                    source ${{env.CICD_UTILS_SCRIPTS_PATH}}
                    generate_bandit_summary_report \
                        "${{env.WORKSPACE}}/bandit-output.json" \
                        "${{env.WORKSPACE}}/sast-report.md" || true

            -   name: Update Check Run
                uses: ./.github/actions/update-check-run
                if: ${{always()}}
                id: update-check-run
                with:
                    check-run-id: ${{steps.create-check-run.outputs.check-run-id}}
                    conclusion: ${{ steps.generate-sast-report.conclusion == 'success' && 'success' || 'failure' }}

            -   name: Send SAST result to external Chat application
                if: ${{always()}}
                run: |
                    source ${{env.CICD_UTILS_SCRIPTS_PATH}}
                    result=${{ steps.generate-sast-report.conclusion == 'success' && 'success' || 'failure' }}
                    if [[ $result == "failure" ]]; then
                      send_file_notification "${{env.WORKSPACE}}/sast-report.md" "🔒SAST Security Scan Issues🔒"
                    fi

    prepare-runner-label:
        name: Prepare runner label
        runs-on: ubuntu-latest
        outputs:
            runner_label: ${{ steps.set-runner-label.outputs.runner_label }}
        steps:
            - name: Generate runner label
              id: set-runner-label
              run: |
                  runner_label=$(echo "${{ inputs.repo_name }}" | sed 's/\//-/g')-${{ inputs.target_branch }}
                  echo "runner_label=$runner_label" >> $GITHUB_OUTPUT

    prepare-backup:
        name: Prepare backup_${{inputs.repo_name}}
        runs-on: ${{ needs.prepare-runner-label.outputs.runner_label }}
        if: inputs.action == 'deploy'
        needs: prepare-runner-label
        environment: ${{inputs.repo_name}}/${{inputs.target_branch}}
        outputs:
          server_latest_backup_file_name: ${{ steps.set-latest-backup-path.outputs.server_latest_backup_file_name }}
          check_run_id: ${{ steps.create-check-run.outputs.check-run-id }}
          use_self_hosted: ${{ steps.determine-runner.outputs.use_self_hosted }}
        env:
          LOCAL_BACKUP_FILE_PATH: ${{github.workspace}}/odoo.zip
          SERVER_TEMPORARY_BACKUP_PATH: /tmp/odoo/backup/${{inputs.repo_name}}/${{inputs.target_branch}}
          SERVER_LATEST_BACKUP_FILE_PATH: /tmp/odoo/backup/${{inputs.repo_name}}/${{inputs.target_branch}}/.odoo.zip
          SERVER_LATEST_BACKUP_FILE_SIZE: 0
          GITHUB_RUN_ATTEMPT: ${{github.run_attempt}}

        steps:
            - uses: actions/checkout@v4
            - name: Set self-hosted runner usage
              run: |
                if [ "${{ needs.prepare-runner-label.outputs.runner_label }}" != "ubuntu-latest" ]; then
                  echo "VAULT_ADDR=http://192.168.98.112:8200/" >> $GITHUB_ENV
                  echo "MINIO_ENDPOINT=http://192.168.98.125:9000/" >> $GITHUB_ENV
                else
                  echo "VAULT_ADDR=${{ secrets.VAULT_ADDR }}" >> $GITHUB_ENV
                  echo "MINIO_ENDPOINT=${{ secrets.MINIO_ENDPOINT }}" >> $GITHUB_ENV
                fi

            - name: get-secrets-vault
              uses: ./.github/actions/get-secrets-vault
              with:
                  vault_addr: ${{ env.VAULT_ADDR }}
                  token: ${{ secrets.VAULT_TOKEN }}
                  secret_paths: ${{ secrets.VAULT_SECRET_PATHS }}

            - name: Create Check Run
              uses: ./.github/actions/create-check-run
              id: create-check-run
              with:
                  name: "Prepare backup"

              # if we have to rerun this job, so run_attempt > 1 and reason maybe is the backup DB have some problem
              # so this case, we should generate a new DB backup
            - name: Make decision to create a new backup on server
              run: |
                if [[ -n ${{env.SERVER_BACKUP_PATH}} && ${{env.SERVER_BACKUP_PATH}} != "_" && ${{ env.GITHUB_RUN_ATTEMPT }} == 1 ]]; then
                  echo "NEED_NEW_SERVER_BACKUP_FILE=0" >> $GITHUB_ENV
                else
                  echo "NEED_NEW_SERVER_BACKUP_FILE=1" >> $GITHUB_ENV
                fi
                if [[ ${{ env.IGNORE_INTEGRATION_TEST }} == "true" ]]; then
                  echo "NEED_NEW_SERVER_BACKUP_FILE=-1" >> $GITHUB_ENV
                fi

            - name: Get the latest backup file from existing backup path on server
              id: get-latest-backup-file
              if: ${{ env.NEED_NEW_SERVER_BACKUP_FILE == 0 }}
              run: |
                latest_file=$(ls ${{ env.SERVER_BACKUP_PATH }} | grep -E '${{env.SERVER_ODOO_DB_NAME}}_[0-9]{4}-[0-9]{2}-[0-9]{2}_[0-9]{2}-[0-9]{2}-[0-9]{2}\.zip' | sort -r | head -n 1)
                if [[ -n $latest_file ]]; then
                  file_path=${{ env.SERVER_BACKUP_PATH }}/$latest_file
                  file_size=$(stat -c%s $file_path)
                  echo "script-output=$file_path|$file_size" >> $GITHUB_OUTPUT
                else
                  echo "script-output=" >> $GITHUB_OUTPUT
                fi

            - name: Update server backup file path variable
              if: ${{ env.NEED_NEW_SERVER_BACKUP_FILE == 0 }}
              run: |
                  output="${{ steps.get-latest-backup-file.outputs.script-output }}"
                  latest_backup_file_path=$(echo "$output" | awk -F'|' '{print $1}')
                  latest_backup_file_size=$(echo "$output" | awk -F'|' '{print $2}')
                  if [[ -n "$latest_backup_file_path" ]]; then
                    echo "SERVER_LATEST_BACKUP_FILE_PATH=$latest_backup_file_path" >> $GITHUB_ENV
                    echo "SERVER_LATEST_BACKUP_FILE_SIZE=$latest_backup_file_size" >> $GITHUB_ENV
                  else
                    echo "NEED_NEW_SERVER_BACKUP_FILE=1" >> $GITHUB_ENV
                  fi

            - name: Backup Odoo on server
              id: backup-on-server
              if: ${{ env.NEED_NEW_SERVER_BACKUP_FILE == 1 }}
              run: |
                  output=$(bash ${{ env.CICD_SCRIPTS_PATH }}/server-backup.sh \
                    "${{env.SERVER_DEPLOY_PATH}}" \
                    "${{env.SERVER_ODOO_DB_NAME}}" \
                    "${{env.SERVER_DB_PASSWORD}}" \
                    "${{env.ODOO_IMAGE_TAG}}" \
                    ${{ env.GITHUB_RUN_ATTEMPT }} \
                    "${{ (env.SERVER_BACKUP_PATH != '' && env.SERVER_BACKUP_PATH != '_') && env.SERVER_BACKUP_PATH || env.SERVER_TEMPORARY_BACKUP_PATH }}")
                  echo "script-output=$output" >> $GITHUB_OUTPUT

            - name: Update server backup file path variable
              if: ${{ env.NEED_NEW_SERVER_BACKUP_FILE == 1 }}
              id: update-server-backup-path
              run: |
                  output="${{ steps.backup-on-server.outputs.script-output }}"
                  latest_backup_file_path=$(echo "$output" | awk -F'|' '{print $1}')
                  latest_backup_file_size=$(echo "$output" | awk -F'|' '{print $2}')
                  if [[ -n "$latest_backup_file_path" ]]; then
                    echo "SERVER_LATEST_BACKUP_FILE_PATH=$latest_backup_file_path" >> $GITHUB_ENV
                    echo "SERVER_LATEST_BACKUP_FILE_SIZE=$latest_backup_file_size" >> $GITHUB_ENV
                  fi

            - name: Set job output from ENV
              id: set-latest-backup-path
              run: |
                  file_name=$(basename "$SERVER_LATEST_BACKUP_FILE_PATH")
                  {
                    echo "server_latest_backup_file_name<<EOF"
                    echo "$file_name"
                    echo "EOF"
                  } >> "$GITHUB_OUTPUT"

            - name: Update Check Run
              uses: ./.github/actions/update-check-run
              if: ${{always()}}
              id: update-check-run
              with:
                  check-run-id: ${{steps.create-check-run.outputs.check-run-id}}
                  conclusion: ${{ steps.determine-runner.conclusion == 'success' && 'success' || 'failure' }}


    integration-test:
        name: _Integration Test_${{inputs.repo_name}}
        needs: prepare-backup
        runs-on: ubuntu-latest
        environment: ${{inputs.repo_name}}/${{inputs.target_branch}}
        env:
            LOCAL_BACKUP_FILE_PATH: ${{github.workspace}}/odoo.zip
            SERVER_TEMPORARY_BACKUP_PATH: /tmp/odoo/backup/${{inputs.repo_name}}/${{inputs.target_branch}}
            GITHUB_RUN_ATTEMPT: ${{github.run_attempt}}

        steps:
            - uses: actions/checkout@v4
            - name: get-secrets-vault
              uses: ./.github/actions/get-secrets-vault
              with:
                  vault_addr: ${{ secrets.VAULT_ADDR }}
                  token: ${{ secrets.VAULT_TOKEN }}
                  secret_paths: ${{ secrets.VAULT_SECRET_PATHS }}

            - name: Create Check Run
              uses: ./.github/actions/create-check-run
              id: create-check-run
              with:
                  name: "Integration test"

            - name: Test Preparation
              uses: ./.github/actions/prepare-test-data

            - name: Check if integration test steps should be ignored
              run: |
                  if [[ ${{ env.IGNORE_INTEGRATION_TEST }} == "true" ]]; then
                    echo "IGNORE_INTEGRATION_TEST_STEPS=1" >> $GITHUB_ENV                
                  fi

            - name: Download backup file from MinIO
              if: ${{ env.IGNORE_INTEGRATION_TEST_STEPS != 1}}
              run: |
                  if ! command -v mc &> /dev/null; then
                      echo "Installing MinIO client..."
                      wget -q https://dl.min.io/client/mc/release/linux-amd64/mc -O /tmp/mc
                      chmod +x /tmp/mc
                      sudo mv /tmp/mc /usr/local/bin/mc || export PATH="/tmp:$PATH"
                  fi
                  minio_alias="backup-minio"
                  minio_endpoint="${MINIO_ENDPOINT:-https://minio.vdx.vn}"
                  backup_file_name=${{ needs.prepare-backup.outputs.server_latest_backup_file_name }}
                  echo "Backup file name detected: $backup_file_name"
                  if [ -z "$backup_file_name" ]; then
                      echo "Error: backup_file_name is empty" >&2
                      exit 1
                  fi
                  mc alias set "$minio_alias" "$minio_endpoint" "${{ env.MINIO_ACCESS_KEY }}" "${{ env.MINIO_SECRET_KEY }}" || {
                      echo "Error: Failed to configure MinIO alias" >&2
                      exit 1
                  }
                  if mc cp "$minio_alias/${{ env.MINIO_BACKUP_BUCKET }}/$backup_file_name" "${{ env.LOCAL_BACKUP_FILE_PATH }}"; then
                      echo "Successfully downloaded $backup_file_name from MinIO"
                  else
                      echo "Error: Failed to download $backup_file_name from MinIO" >&2
                      exit 1
                  fi

            - name: Run Integration test
              id: run_integration_test
              if: ${{ env.IGNORE_INTEGRATION_TEST_STEPS != 1}}
              run: |
                  bash ${{env.CICD_SCRIPTS_PATH}}/run-integration-test.sh "${{env.LOCAL_BACKUP_FILE_PATH}}" "${{inputs.commit_sha}}" "${{env.IGNORE_TEST}}"

            - name: Update Check Run
              uses: ./.github/actions/update-check-run
              if: ${{always()}}
              id: update-check-run
              with:
                  check-run-id: ${{steps.create-check-run.outputs.check-run-id}}
                  conclusion: ${{ steps.run_integration_test.conclusion == 'success' && 'success' || 'failure' }}

            - name: Post Integration Test notification
              if: ${{always()}}
              id: post-integration-test-notification
              run: |
                  gh_url="https://api.github.com/repos/${{github.repository}}/actions/runs/${{github.run_id}}/jobs"
                  bash ${{env.CICD_SCRIPTS_PATH}}/post-integration-test.sh "${{ (contains(fromJson('["success","skipped", "cancelled"]'), steps.run_integration_test.conclusion) && steps.run_integration_test.conclusion) || 'failure' }}" "$gh_url" "${{env.GH_TOKEN}}" "_Integration Test_"


    deploy-server:
        name: _Deploy Server_${{inputs.repo_name}}
        runs-on: ${{ needs.prepare-runner-label.outputs.runner_label }}
        if: inputs.action == 'deploy'
        environment: ${{inputs.repo_name}}/${{inputs.target_branch}}
        needs: [ integration-test, prepare-runner-label ]
        steps:
            -   uses: actions/checkout@v4
            - name: Set Vault Addr
              run: |
                if [ "${{ needs.prepare-runner-label.outputs.runner_label }}" != "ubuntu-latest" ]; then
                  echo "VAULT_ADDR=http://192.168.98.112:8200/" >> $GITHUB_ENV
                else
                  echo "VAULT_ADDR=${{ secrets.VAULT_ADDR }}" >> $GITHUB_ENV
                fi                

            -   name: get-secrets-vault
                uses: ./.github/actions/get-secrets-vault
                with:
                    vault_addr: ${{ env.VAULT_ADDR }}
                    token: ${{ secrets.VAULT_TOKEN }}
                    secret_paths: ${{ secrets.VAULT_SECRET_PATHS }}

            -   name: Create Check Run
                uses: ./.github/actions/create-check-run
                id: create-check-run
                with:
                    name: "Deploy to Server"

            -   name: "Deploy to server"
                id: deploy_to_server
                env:
                    SERVER_CUSTOM_ADDONS_PATH: ${{env.SERVER_DEPLOY_PATH}}/..
                    SERVER_CONFIG_FILE: ${{env.SERVER_DEPLOY_PATH}}/etc/odoo.conf
                    SERVER_DOCKER_COMPOSE_PATH: ${{env.SERVER_DEPLOY_PATH}}
                run: |
                    bash ${{ env.CICD_SCRIPTS_PATH }}/server-deploy.sh \
                      "${{env.SERVER_DOCKER_COMPOSE_PATH}}" \
                      "${{env.SERVER_CUSTOM_ADDONS_PATH}}" \
                      "${{env.SERVER_CONFIG_FILE}}" \
                      "${{ env.SERVER_ODOO_URL }}" \
                      "${{ env.SERVER_ODOO_DB_NAME }}" \
                      "${{ env.SERVER_DB_PASSWORD }}" \
                      "${{ env.IGNORED_AUTO_INSTALL }}"

            -   name: Update Check Run
                uses: ./.github/actions/update-check-run
                if: ${{always()}}
                id: update-check-run
                with:
                    check-run-id: ${{steps.create-check-run.outputs.check-run-id}}
                    conclusion: ${{ (contains(fromJson('["success","skipped", "cancelled"]'), steps.deploy_to_server.conclusion) && steps.deploy_to_server.conclusion) || 'failure' }}

            -   name: Post Deploy notification
                if: ${{always()}}
                id: post-deploy-notification
                run: |
                    gh_url="https://api.github.com/repos/${{github.repository}}/actions/runs/${{github.run_id}}/jobs"
                    bash ${{env.CICD_SCRIPTS_PATH}}/post-server-deploy.sh "${{ (contains(fromJson('["success","skipped", "cancelled"]'), steps.deploy_to_server.conclusion) && steps.deploy_to_server.conclusion) || 'failure' }}"  "$gh_url" "${{env.GH_TOKEN}}" "_Deploy Server_"
