run-name: ${{inputs.repo_name}} - Update the latest Docker images on the servers.
on:
    workflow_dispatch:
        inputs:
            repo_name:
                required: true
                type: string
            branch:
                required: true
                type: string
            repo_owner:
                required: true
                type: string
jobs:
    update-docker-images-on-server:
        runs-on: ubuntu-latest
        environment: ${{inputs.repo_name}}/${{inputs.branch}}
        steps:
            - uses: actions/checkout@v4
            - name: get-secrets-vault
              uses: ./.github/actions/get-secrets-vault
              with:
                  vault_addr: ${{ env.VAULT_ADDR }}
                  token: ${{ secrets.VAULT_TOKEN }}
                  secret_paths: ${{ secrets.VAULT_SECRET_PATHS }}


            - name: " Update latest docker images on the server"
              uses: ./.github/actions/ssh-script
              with:
                  host: ${{env.SERVER_HOST}}
                  port: ${{env.SERVER_SSH_PORT}}
                  user: ${{env.SERVER_USER}}
                  ssh_key_text: ${{ env.SERVER_PRIVATE_KEY }}
                  proxy_host: ${{env.PROXY_SERVER_HOST}}
                  proxy_port: ${{env.PROXY_SERVER_SSH_PORT}}
                  proxy_user: ${{env.PROXY_SERVER_USER}}
                  proxy_ssh_key_text: ${{ env.PROXY_SERVER_PRIVATE_KEY }}
                  script: |
                      docker login -u ${{ inputs.repo_owner }} -p ${{ secrets.GH_TOKEN }} ghcr.io
                      cd ${{ env.SERVER_DEPLOY_PATH }}
                      docker compose stop
                      docker compose down
                      docker compose pull
                      docker compose up -d
                      docker image prune -a -f
                      docker logout ghcr.io
